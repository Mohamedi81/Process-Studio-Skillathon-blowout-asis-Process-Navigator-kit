<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>As-Is Process Navigator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #f4f5f7; color: #172b4d; font-size: 13px; }
button, select, input { font-family: inherit; }
.topbar { background: #0052cc; color: #fff; padding: 9px 20px; display: flex; align-items: center; gap: 18px; position: sticky; top: 0; z-index: 200; box-shadow: 0 2px 6px rgba(0,0,0,.2); flex-wrap: wrap; }
.brand { min-width: 220px; }
.t1 { font-size: 14px; font-weight: 700; }
.t2 { font-size: 10px; opacity: .75; margin-top: 1px; }
.viewsw { display: flex; background: rgba(255,255,255,.14); border-radius: 6px; overflow: hidden; }
.vbtn { background: none; border: none; color: rgba(255,255,255,.75); padding: 7px 16px; font-size: 12px; font-weight: 600; cursor: pointer; }
.vbtn:hover { color: #fff; }
.vbtn.on { background: #fff; color: #0052cc; }
.filters { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filters label { font-size: 10px; opacity: .8; }
.filters select, .filters input { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
.filters input::placeholder { color: rgba(255,255,255,.65); }
.filters select option { background: #0052cc; color: #fff; }
.fbtn { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }
.notebar { background: #fffae6; border-bottom: 1px solid #ffe380; color: #7a4800; font-size: 11px; padding: 6px 20px; display: none; }
.hide { display: none !important; }

/* structured layout */
#vStruct { display: flex; min-height: calc(100vh - 56px); }
#side { width: 262px; flex-shrink: 0; background: #fff; border-right: 1px solid #dfe1e6; padding: 12px 10px; overflow-y: auto; position: sticky; top: 56px; max-height: calc(100vh - 56px); align-self: flex-start; }
#main { flex: 1; padding: 16px 20px 40px; min-width: 0; }
.ptitle { font-size: 9px; font-weight: 700; color: #6b778c; text-transform: uppercase; letter-spacing: 1px; margin: 4px 4px 6px; }
.divider { height: 1px; background: #dfe1e6; margin: 10px 0; }
.tree, .tree ul { list-style: none; }
.tree ul { margin-left: 14px; border-left: 1px solid #ebecf0; display: none; }
.tree li.open > ul { display: block; }
.tnode { display: flex; align-items: flex-start; gap: 2px; padding: 2px 2px; border-radius: 4px; }
.tnode:hover { background: #f4f5f7; }
.tg { width: 14px; flex-shrink: 0; text-align: center; cursor: pointer; color: #8993a4; font-size: 9px; padding-top: 3px; transition: transform .15s; user-select: none; }
.tg.empty { visibility: hidden; }
li.open > .tnode > .tg { transform: rotate(90deg); }
.tl { flex: 1; font-size: 11px; color: #172b4d; cursor: pointer; line-height: 1.35; padding: 1px 3px; border-radius: 3px; }
.tl.sel { background: #deebff; color: #0052cc; font-weight: 600; }
.tl .lv { font-size: 8px; font-weight: 700; color: #fff; border-radius: 3px; padding: 0 4px; margin-right: 4px; vertical-align: 1px; }
.tl.l1 { font-weight: 700; }
.legend { font-size: 10px; color: #42526e; display: flex; flex-direction: column; gap: 5px; padding: 0 4px; }
.legend .row { display: flex; align-items: center; gap: 6px; }
.sw { width: 22px; height: 13px; border-radius: 3px; color: #fff; font-size: 8px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.fdim { opacity: .22; filter: grayscale(1); }
.crumbs { font-size: 11px; color: #6b778c; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.crumbs a { color: #0052cc; cursor: pointer; }
.crumbs a:hover { text-decoration: underline; }
.crumbs .cur { color: #172b4d; font-weight: 600; }

/* badges, tags, chips */
.bd { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 8px; border: 1px solid; white-space: nowrap; display: inline-block; }
.bd.pain { background: #ffebe6; color: #bf2600; border-color: #ffbdad; }
.bd.idea { background: #fff0b3; color: #7a4800; border-color: #ffe380; }
.bd.q { background: #eae6ff; color: #403294; border-color: #c0b6f2; }
.tag { font-size: 9px; padding: 1px 7px; border-radius: 8px; font-weight: 600; display: inline-block; }
.m-manual { background: #ffebe6; color: #bf2600; }
.m-system { background: #deebff; color: #0747a6; }
.m-automated { background: #e3fcef; color: #006644; }
.sysc { background: #fff; border: 1px solid #dfe1e6; border-radius: 3px; padding: 1px 6px; font-size: 9px; font-weight: 600; color: #42526e; display: inline-block; cursor: pointer; }
.sysc:hover { border-color: #0052cc; color: #0052cc; }
.rchip { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: #42526e; background: #f4f5f7; padding: 2px 7px; border-radius: 9px; }
.rchip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.btn { background: #fff; border: 1px solid #c1c7d0; color: #0052cc; border-radius: 4px; padding: 4px 10px; font-size: 11px; font-weight: 600; cursor: pointer; }
.btn:hover { background: #deebff; border-color: #0052cc; }
.btn.pri { background: #0052cc; color: #fff; border-color: #0052cc; }

/* overview */
.hero { background: linear-gradient(135deg,#0052cc,#0747a6); color: #fff; border-radius: 8px; padding: 18px 22px; margin-bottom: 14px; }
.hero h2 { font-size: 20px; margin: 3px 0 6px; }
.hero p { font-size: 12px; opacity: .88; line-height: 1.55; max-width: 900px; }
.eyebrow { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; opacity: .75; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin-bottom: 14px; }
.kpi { background: #fff; border: 1px solid #dfe1e6; border-radius: 6px; padding: 10px 12px; }
.kpi b { font-size: 20px; display: block; }
.kpi span { font-size: 10px; color: #6b778c; }
.card-box { background: #fff; border: 1px solid #dfe1e6; border-radius: 7px; padding: 12px 14px; margin-bottom: 14px; }
.card-box h3 { font-size: 12px; margin-bottom: 8px; }
.stagestrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.scard { border: 1px solid #dfe1e6; border-top-width: 4px; border-radius: 6px; padding: 10px; background: #fafbfc; cursor: pointer; transition: box-shadow .15s; }
.scard:hover { box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.scard .sc-code { font-size: 9px; font-weight: 700; color: #6b778c; text-transform: uppercase; letter-spacing: .6px; }
.scard .sc-name { font-size: 12px; font-weight: 700; margin: 2px 0 4px; }
.scard .sc-p { font-size: 10px; color: #42526e; line-height: 1.45; margin-bottom: 6px; }
.scard .sc-b { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.matrix { border-collapse: collapse; width: 100%; font-size: 11px; }
.matrix th { font-size: 9px; text-transform: uppercase; color: #6b778c; font-weight: 700; padding: 4px 6px; text-align: center; }
.matrix th:first-child, .matrix td:first-child { text-align: left; }
.matrix td { padding: 4px 6px; text-align: center; border-top: 1px solid #ebecf0; }
.matrix td.cell { cursor: pointer; font-weight: 700; color: #0747a6; }
.matrix td.cell:hover { outline: 2px solid #0052cc; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 1100px) { .two { grid-template-columns: 1fr; } }
.hot { display: flex; flex-direction: column; gap: 4px; }
.hot a { display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px; background: #f4f5f7; border-radius: 4px; cursor: pointer; font-size: 11px; color: #172b4d; }
.hot a:hover { background: #deebff; }

/* stage view */
.shead { color: #fff; padding: 14px 20px; border-radius: 7px; margin-bottom: 10px; }
.shead h2 { font-size: 18px; margin: 3px 0 5px; }
.shead p { font-size: 11px; opacity: .9; line-height: 1.5; max-width: 900px; }
.shead .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
.shead .chip { background: rgba(255,255,255,.2); border-radius: 12px; padding: 2px 10px; font-size: 10px; font-weight: 500; }
.lvl { margin-bottom: 8px; border: 1px solid #dfe1e6; border-radius: 6px; overflow: hidden; background: #fff; }
.lvl-h { display: flex; align-items: stretch; }
.lvl-b { width: 38px; flex-shrink: 0; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.lvl-t { flex: 1; padding: 6px 12px; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lvl-body { border-top: 1px solid #ebecf0; padding: 10px 12px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { background: #f4f5f7; border: 1px solid #dfe1e6; border-radius: 20px; padding: 5px 12px; font-size: 11px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; user-select: none; }
.pill:hover { background: #deebff; border-color: #0052cc; color: #0052cc; }
.pill.active { background: #0052cc; border-color: #0052cc; color: #fff; box-shadow: 0 2px 6px rgba(0,82,204,.3); }
.pill small { font-size: 9px; opacity: .75; }
.arr { color: #c1c7d0; }
.hint { font-size: 9px; color: #8993a4; margin-top: 6px; width: 100%; }
.seg { display: inline-flex; border: 1px solid #dfe1e6; border-radius: 5px; overflow: hidden; background: #f4f5f7; }
.seg button { border: none; background: none; padding: 3px 10px; font-size: 10px; font-weight: 600; color: #6b778c; cursor: pointer; }
.seg button.on { background: #0052cc; color: #fff; }
.stepbox { background: #f7faff; border: 1px solid #deebff; border-radius: 6px; padding: 10px 12px; margin-top: 10px; }
.stepbox h4 { font-size: 12px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.gates { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 8px; }
.gate { border: 1px solid #0052cc; background: #f0f4ff; border-radius: 6px; padding: 9px 11px; }
.gate .g-l { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #6b778c; }
.gate .g-n { font-size: 12px; font-weight: 700; color: #0747a6; margin: 1px 0 3px; }
.gate .g-q { font-size: 10px; color: #42526e; line-height: 1.45; margin-bottom: 5px; }
.gate ul { margin: 0 0 6px 15px; font-size: 10px; color: #42526e; }
.opts { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.opt { font-size: 9px; font-weight: 700; padding: 1px 7px; border-radius: 8px; border: 1px solid; }
.o-forward { background: #e3fcef; border-color: #abf5d1; color: #006644; }
.o-fast { background: #e6fcff; border-color: #b3f5ff; color: #006884; }
.o-loop { background: #ffebe6; border-color: #ffbdad; color: #bf2600; }
.o-stop { background: #ffebe6; border-color: #bf2600; color: #bf2600; }
.o-pause { background: #fff0b3; border-color: #ffe380; color: #7a4800; }
.o-handoff { background: #e3fcef; border-color: #006644; color: #006644; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
.acard { background: #fafbfc; border: 1px solid #dfe1e6; border-radius: 6px; overflow: hidden; }
.acard:hover { border-color: #c1c7d0; }
.acard.open { grid-column: 1 / -1; border-color: #0052cc; box-shadow: 0 2px 10px rgba(0,82,204,.14); background: #fff; }
.acard.hl { border-color: #0052cc; background: #fff; }
.acard.gone { display: none; }
.acard.dimmed { opacity: .2; pointer-events: none; }
.asum { padding: 10px 11px; cursor: pointer; }
.arow { display: flex; justify-content: space-between; gap: 6px; align-items: flex-start; margin-bottom: 4px; }
.atitle { font-size: 11px; font-weight: 600; flex: 1; }
.abd { display: flex; gap: 3px; align-items: center; flex-shrink: 0; }
.chev { font-size: 9px; color: #6b778c; transition: transform .15s; }
.acard.open .chev { transform: rotate(90deg); color: #0052cc; }
.plabel { font-size: 9px; color: #0052cc; background: #deebff; border-radius: 3px; padding: 1px 6px; display: inline-block; margin-bottom: 5px; font-weight: 600; }
.adesc { font-size: 10px; color: #42526e; line-height: 1.5; margin: 4px 0; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.adet { display: none; border-top: 1px solid #deebff; background: #f7faff; padding: 12px 14px; }
.acard.open .adet { display: block; }
.dg { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.sec { margin-bottom: 8px; }
.sec-l { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; margin-bottom: 5px; color: #6b778c; }
.sec-l.pain { color: #bf2600; } .sec-l.idea { color: #b07d00; } .sec-l.q { color: #403294; }
.pp { background: #fff; border: 1px solid #dfe1e6; border-left: 3px solid #ff5630; border-radius: 4px; padding: 6px 9px; margin-bottom: 5px; font-size: 10px; line-height: 1.5; }
.pp.sev-low { border-left-color: #ffab00; } .pp.sev-medium { border-left-color: #ff7452; }
.pp .sev { font-size: 8px; font-weight: 700; text-transform: uppercase; color: #bf2600; margin-right: 6px; }
.idea-c { background: #fffae6; border: 1px solid #ffe380; border-left: 3px solid #f6c900; border-radius: 4px; padding: 6px 9px; margin-bottom: 5px; font-size: 10px; line-height: 1.5; }
.idea-c .itag { font-size: 8px; font-weight: 700; text-transform: uppercase; background: #e6fcff; color: #006884; border: 1px solid #b3f5ff; border-radius: 6px; padding: 1px 6px; margin-right: 5px; }
.oq { background: #fff; border: 1px solid #dfe1e6; border-left: 3px solid #6554c0; border-radius: 4px; padding: 6px 9px; margin-bottom: 5px; font-size: 10px; line-height: 1.5; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.io { font-size: 10px; color: #42526e; line-height: 1.6; }
.metarow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin: 4px 0 8px; }
.tasks { margin-top: 10px; border-top: 1px dashed #c1c7d0; padding-top: 8px; }
.tasks > .sec-l { display: flex; align-items: center; gap: 6px; }
details.task { background: #fff; border: 1px solid #dfe1e6; border-radius: 5px; margin-bottom: 4px; }
details.task[open] { border-color: #5e6c84; }
details.task > summary { list-style: none; cursor: pointer; padding: 6px 9px; display: flex; align-items: center; gap: 8px; font-size: 11px; }
details.task > summary::-webkit-details-marker { display: none; }
details.task > summary::before { content: '\25B6'; font-size: 8px; color: #6b778c; transition: transform .15s; }
details.task[open] > summary::before { transform: rotate(90deg); }
details.task .tn { flex: 1; font-weight: 600; }
details.task .tcode { font-size: 9px; color: #fff; background: #5e6c84; border-radius: 3px; padding: 0 5px; }
details.task .tbody { padding: 4px 12px 10px 24px; border-top: 1px solid #ebecf0; }
details.task.hl { border-color: #0052cc; box-shadow: 0 0 0 2px #deebff; }
.empty { color: #8993a4; font-size: 10px; font-style: italic; }
.mini-flow { display: flex; flex-wrap: wrap; gap: 0; margin: 6px 0 10px; }
.mf { font-size: 10px; background: #deebff; color: #0747a6; padding: 5px 14px 5px 18px; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%, 10px 50%); margin-right: -6px; cursor: pointer; font-weight: 600; }
.mf:first-child { clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%); padding-left: 10px; }
.mf:hover { background: #0052cc; color: #fff; }

/* flow view */
#vFlow { display: none; flex-direction: column; height: calc(100vh - 56px); }
.ftool { background: #fff; border-bottom: 1px solid #dfe1e6; padding: 7px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 11px; }
.ftool select { border: 1px solid #c1c7d0; border-radius: 4px; padding: 3px 6px; font-size: 11px; }
.ftool .btn { padding: 3px 9px; }
.flegend { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 10px; color: #42526e; margin-left: auto; }
.flegend .li { display: flex; gap: 5px; align-items: center; }
.flegend .lb { width: 13px; height: 11px; border-radius: 2px; border: 1px solid #888; }
.fwrap { flex: 1; position: relative; display: flex; min-height: 0; }
#fscroll { flex: 1; overflow: auto; background: #fff; }
#drawer { width: 410px; flex-shrink: 0; background: #fff; border-left: 1px solid #dfe1e6; overflow-y: auto; box-shadow: -4px 0 12px rgba(0,0,0,.06); display: none; }
#drawer.on { display: block; }
.dh { padding: 12px 14px; border-bottom: 1px solid #ebecf0; position: sticky; top: 0; background: #fff; z-index: 2; }
.dh .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.dh h3 { font-size: 14px; margin: 3px 0; }
.dh .x { background: none; border: none; font-size: 18px; cursor: pointer; color: #6b778c; }
.dh .lv { font-size: 9px; font-weight: 700; color: #fff; background: #0747a6; border-radius: 3px; padding: 1px 6px; }
.db { padding: 10px 14px 24px; }
.dacts { display: flex; gap: 6px; margin: 8px 0 2px; flex-wrap: wrap; }
.fnode { cursor: pointer; }
.fnode:hover .nshape { stroke: #0052cc; stroke-width: 2.5; }
.fnode.sel .nshape { stroke: #0052cc; stroke-width: 3.5; }
.fnode.pulse .nshape { animation: pulse 0.9s ease-in-out 3; }
@keyframes pulse { 0%,100% { stroke-width: 3; } 50% { stroke-width: 9; stroke-opacity: .45; } }
.fband { cursor: pointer; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="t1" id="tTitle"></div><div class="t2" id="tSub"></div></div>
  <div class="viewsw">
    <button class="vbtn" data-act="view" data-id="structured">Structured view</button>
    <button class="vbtn" data-act="view" data-id="flow">Flow view</button>
  </div>
  <div class="filters">
    <input id="fq" type="search" placeholder="Search process...">
    <label>Role</label><select id="fRole"></select>
    <label>System</label><select id="fSys"></select>
    <label>Show only</label>
    <select id="fLens">
      <option value="">Everything</option>
      <option value="pain">With pain points</option>
      <option value="idea">With ideas</option>
      <option value="q">With open questions</option>
    </select>
    <button class="fbtn" data-act="clear">Clear</button>
  </div>
</div>
<div class="notebar" id="noteBar"></div>

<div id="vStruct">
  <aside id="side"></aside>
  <main id="main"></main>
</div>

<div id="vFlow">
  <div class="ftool">
    <span>Colour by
      <select id="fColor">
        <option value="">Step type</option>
        <option value="pain">Pain points</option>
        <option value="idea">Ideas captured</option>
        <option value="q">Open questions</option>
        <option value="mode">Execution mode</option>
      </select>
    </span>
    <span>Show <select id="fSysLbl"><option value="">Nothing extra</option><option value="sys">Systems</option><option value="role">Owner role</option></select></span>
    <span><button class="btn" data-act="zoom" data-id="out">-</button> <span id="zlbl">75%</span> <button class="btn" data-act="zoom" data-id="in">+</button> <button class="btn" data-act="zoom" data-id="fit">Fit width</button></span>
    <div class="flegend" id="flegend"></div>
  </div>
  <div class="fwrap">
    <div id="fscroll"><svg id="fsvg" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,system-ui,sans-serif"></svg></div>
    <aside id="drawer"></aside>
  </div>
</div>

<script id="model-data" type="application/json">__MODEL_JSON__</script>
<script>
(function () {
'use strict';
var M = JSON.parse(document.getElementById('model-data').textContent);
var $ = function (s, r) { return (r || document).querySelector(s); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var arr = function (x) { return Array.isArray(x) ? x : (x ? [x] : []); };

/* ---------- normalise + index ---------- */
var STAGE_COLORS = ['#0052cc', '#0065ff', '#0747a6', '#2684ff', '#403294', '#00875a', '#ff8b00', '#008da6'];
var LCOL = { 1: '#172b4d', 2: '#0052cc', 3: '#0747a6', 4: '#253858', 5: '#5e6c84' };
var MODE_LBL = { manual: 'Manual', system: 'System-supported', automated: 'Automated' };
var roles = {}, systems = {}, items = {}, decisions = {};
arr(M.roles).forEach(function (r) { roles[r.id] = r; });
arr(M.systems).forEach(function (s) { systems[s.id] = s; });
arr(M.decisions).forEach(function (d) { decisions[d.id] = d; d.options = arr(d.options); d.criteria = arr(d.criteria); });
var role = function (id) { return roles[id] || { id: id, name: id || 'Unassigned', short: id || 'n/a', color: '#6b778c' }; };
var sysName = function (id) { return (systems[id] && systems[id].name) || id; };

}
function goFlow(id) {
  var n = nodeFor(id);
  S.view = 'flow';
  S.fsel = n ? n.id : S.fsel;
  S.ffocus = (items[id] && items[id]._level >= 4) ? id : null;
  render();
  if (n) setTimeout(function () {
    var p = flow.pos(n), sc = $('#fscroll');
    sc.scrollTo({ left: Math.max(0, p.x * S.zoom - sc.clientWidth / 2 + (sc.clientWidth > 900 ? 0 : 0)), top: Math.max(0, p.y * S.zoom - sc.clientHeight / 2), behavior: 'smooth' });
    var g = document.getElementById('fn-' + n.id); if (g) { g.classList.add('pulse'); setTimeout(function () { g.classList.remove('pulse'); }, 2800); }
    if (S.ffocus) scrollToEl('df-' + S.ffocus, 'center');
  }, 60);
}
function setZoom(z) { S.zoom = Math.max(0.3, Math.min(1.6, z)); render(); }

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t) return;
  var act = t.dataset.act, id = t.dataset.id;
  if (act === 'view') { S.view = id; render(); }
  else if (act === 'nav') { goStruct(id); }
  else if (act === 'struct') { goStruct(id); }
  else if (act === 'flow') { goFlow(id); }
  else if (act === 'node') { S.fsel = id; S.ffocus = null; render(); }
  else if (act === 'close') { S.fsel = null; render(); }
  else if (act === 'ffocus') { S.ffocus = id; render(); scrollToEl('df-' + id, 'center'); }
  else if (act === 'step') { S.step = (S.step === id) ? null : id; S.act = null; S.task = null; render(); }
  else if (act === 'mode') { S.mode = id; render(); }
  else if (act === 'card') {
    var open = S.act === id; S.act = open ? null : id; S.task = null;
    document.querySelectorAll('.acard.open').forEach(function (c) { c.classList.remove('open'); });
    if (!open) { var c = document.getElementById('el-' + id); if (c) c.classList.add('open'); }
    writeHash(); $('#side').innerHTML = treeHTML();
  }
  else if (act === 'tg') { S.tree[id] = S.tree[id] ? 0 : 1; t.closest('li').classList.toggle('open', !!S.tree[id]); }
  else if (act === 'sys') { Fl.sys = id; $('#fSys').value = id; render(); }
  else if (act === 'rolecell') { Fl.role = t.dataset.role; $('#fRole').value = Fl.role; goStruct(id); }
  else if (act === 'zoom') { if (id === 'in') setZoom(S.zoom + 0.1); else if (id === 'out') setZoom(S.zoom - 0.1); else setZoom(($('#fscroll').clientWidth - 20) / flow.W); }
  else if (act === 'clear') { Fl = { role: '', sys: '', lens: '', q: '' }; $('#fq').value = ''; $('#fRole').value = ''; $('#fSys').value = ''; $('#fLens').value = ''; render(); }
});
$('#fRole').addEventListener('change', function (e) { Fl.role = e.target.value; render(); });
$('#fSys').addEventListener('change', function (e) { Fl.sys = e.target.value; render(); });
$('#fLens').addEventListener('change', function (e) { Fl.lens = e.target.value; render(); });
$('#fq').addEventListener('input', function (e) { Fl.q = e.target.value.trim().toLowerCase(); render(); });
$('#fColor').addEventListener('change', function (e) { S.color = e.target.value; render(); });
$('#fSysLbl').addEventListener('change', function (e) { S.label = e.target.value; render(); });

/* ---------- init ---------- */
function init() {
  var meta = M.meta || {}; M.meta = meta;
  $('#tTitle').textContent = meta.title || 'As-Is Process Navigator';
  $('#tSub').textContent = meta.subtitle || '';
  document.title = meta.title || 'As-Is Process Navigator';
  if (meta.note) { var nb = $('#noteBar'); nb.textContent = meta.note; nb.style.display = 'block'; }
  var ro = '<option value="">All</option>' + Object.keys(roles).map(function (r) { return '<option value="' + esc(r) + '">' + esc(roles[r].name) + '</option>'; }).join('');
  $('#fRole').innerHTML = ro;
  var us = {}; allItems.forEach(function (i) { i.systems.forEach(function (s) { us[s] = 1; }); });
  $('#fSys').innerHTML = '<option value="">All</option>' + Object.keys(us).sort(function (a, b) { return sysName(a).localeCompare(sysName(b)); }).map(function (s) { return '<option value="' + esc(s) + '">' + esc(sysName(s)) + '</option>'; }).join('');
  buildFlow(); readHash(); render();
}
init();
})();
</script>
</body>
</html>
